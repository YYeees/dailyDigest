name: Weekly GitHub Trending

on:
  schedule:
    # 每周一 UTC 01:00(北京时间周一上午9点)跑一次——2026-08-15从每日改成每周，
    # 日榜量太大(单天能有50+新仓库)，评估成本跟"只展示top6/10"这个精简目标不匹配。
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run rank-github-trending skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "调用 rank-github-trending 这个skill，完整跑一遍流程：抓取本周trending、评估所有待处理仓库(evaluated_at为空的)、导出前端JSON、git commit+push。这是无人值守的定时任务，commit+push不需要额外确认，直接做。" \
            --permission-mode bypassPermissions
