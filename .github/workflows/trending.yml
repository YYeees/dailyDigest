name: Weekly GitHub Trending

on:
  schedule:
    # 每周日UTC 23:00(北京时间周一早上7点)跑一次——2026-08-15从每日改成每周(日榜量太大，
    # 单天能有50+新仓库，评估成本跟"只展示top6/10"这个精简目标不匹配)；2026-08-16把时间
    # 往前调了2小时(北京时间原定9点改成7点)。
    - cron: '0 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run rank-github-trending skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 见digest.yml同一处注释：强制5分钟prompt cache TTL，省cache写入的钱
          FORCE_PROMPT_CACHING_5M: "1"
        run: |
          claude -p "调用 rank-github-trending 这个skill，完整跑一遍流程：抓取本周trending、评估所有待处理仓库(evaluated_at为空的)、导出前端JSON、git commit+push。这是无人值守的定时任务，commit+push不需要额外确认，直接做。" \
            --permission-mode bypassPermissions --output-format json | tee /tmp/claude_result.json

      - name: Log token usage and cost
        run: |
          python3 scripts/log_usage.py /tmp/claude_result.json --label trending
          git add logs/trending.jsonl docs/data/run_log.json
          git diff --cached --quiet || git commit -m "Log trending run usage/cost"
          git push

      # 公开站(yyeees.github.io/AIDailyNews)只放命中AI track的内容，过滤规则和自检见
      # export_public.py。放在最后:上一步刚把这次的花费写进docs/data/run_log.json，
      # 公开站的运行日志板块要显示的就是它。
      # always(): 这次跑挂了也照样发布——花费数据同样该更新，内容没变则脚本自己跳过推送。
      - name: Publish public site
        if: always()
        env:
          AIDAILYNEWS_DEPLOY_KEY: ${{ secrets.AIDAILYNEWS_DEPLOY_KEY }}
        run: bash scripts/publish_public.sh
