name: Daily Digest

on:
  schedule:
    # 每天UTC 22:00(北京时间早6点)跑一次，赶在用户早上打开网页之前把当天内容准备好。
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run run-digest skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # 订阅token认证默认会给prompt cache用1小时TTL(写入价格2倍基准价)，但这个job全程
          # 只有几分钟，5分钟TTL(写入价格1.25倍)完全够用，强制5分钟能省一截cache写入的钱
          # (2026-08-17查claude CLI源码确认有这个开关，见run_log.json里cache_creation的
          # ephemeral_1h_input_tokens远高于ephemeral_5m_input_tokens)。
          FORCE_PROMPT_CACHING_5M: "1"
        run: |
          claude -p "调用 run-digest 这个skill，完整跑一遍流程：抓取新内容、两段式判断优先级、生成摘要、导出前端JSON、git commit+push。这是无人值守的定时任务，commit+push不需要额外确认，直接做。" \
            --permission-mode bypassPermissions --output-format json | tee /tmp/claude_result.json

      - name: Log token usage and cost
        run: |
          python3 scripts/log_usage.py /tmp/claude_result.json --label digest
          git add logs/digest.jsonl docs/data/run_log.json
          git diff --cached --quiet || git commit -m "Log digest run usage/cost"
          git push
