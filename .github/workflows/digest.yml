name: Daily Digest

on:
  schedule:
    # 每天UTC 22:17(北京时间早6:17)跑一次，赶在用户早上打开网页之前把当天内容准备好。
    - cron: '17 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: digest-content-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run run-digest skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          # 订阅token认证默认给prompt cache用1小时TTL(写入价2倍)，job只跑几分钟，强制5分钟TTL(1.25倍)省钱
          FORCE_PROMPT_CACHING_5M: "1"
        run: |
          claude -p "调用 run-digest 这个skill，完整跑一遍流程：抓取新内容、两段式判断优先级、生成摘要、导出前端JSON、git commit+push。这是无人值守的定时任务，commit+push不需要额外确认，直接做。" \
            --permission-mode bypassPermissions --output-format json | tee /tmp/claude_result.json

      - name: Health check
        if: always()
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python3 scripts/health_check.py --agent-result /tmp/claude_result.json

      # always(): 自检没过也要把这次的花费记下来，别因为报警就丢了成本数据
      - name: Log token usage and cost
        if: always()
        run: |
          python3 scripts/log_usage.py /tmp/claude_result.json --label digest
          git add logs/digest.jsonl docs/data/run_log.json
          git diff --cached --quiet || git commit -m "Log digest run usage/cost"
          git push

      # 公开站(yyeees.github.io/AIDailyNews)只放命中AI track的内容，过滤规则和自检见
      # export_public.py。放在最后:上一步刚把这次的花费写进docs/data/run_log.json，
      # 公开站的运行日志板块要显示的就是它。
      # always(): 这次跑挂了也照样发布——花费数据同样该更新，内容没变则脚本自己跳过推送。
      - name: Publish public site
        if: always()
        env:
          AIDAILYNEWS_DEPLOY_KEY: ${{ secrets.AIDAILYNEWS_DEPLOY_KEY }}
        run: bash scripts/publish_public.sh
