<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月度 Digest · Daily Digest</title>
<style>
  :root {
    --bg: #F0EEE6;
    --card: #FAF9F5;
    --text: #141413;
    --muted: #5F5E57;
    --border: #DDDAD0;
    --accent: #B5522A;
    --high: #B5522A;
    --medium: #716F67;
    --tag-high-bg: #cbcadb;
    --tag-ai-bg: #bcd1ca;
    --tag-anchor-bg: #bcd1ca;
    --today-bg: var(--card);
    --today-border: var(--accent);
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    line-height: 1.75;
  }
  header {
    padding: 24px 24px 10px;
    max-width: 1080px;
    width: 94%;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin: 0 0 14px; font-weight: 700; }
  select {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 1rem;
    font-weight: 600;
    padding: 9px 34px 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background-color: var(--card);
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="13" height="8" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%235F5E57" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat: no-repeat;
    background-position: right 15px center;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  select:hover { border-color: var(--accent); }
  select:focus { outline: none; border-color: var(--accent); }
  nav {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--accent); }
  nav a.active { color: var(--text); font-weight: 600; }
  main { max-width: 1080px; width: 94%; margin: 0 auto; padding: 10px 24px 60px; }
  .track { margin-top: 32px; }
  .track h2 {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.95rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .track-items {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  @media (min-width: 760px) {
    .track-items { grid-template-columns: 1fr 1fr; }
  }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 0;
  }
  .item.medium { opacity: 0.88; }
  .item.today { border: 2px solid var(--today-border); }
  .item-meta {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.92rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .tier-tag {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
  }
  .tier-high { background: var(--tag-high-bg); color: var(--text); }
  .tier-medium { background: var(--tag-high-bg); color: var(--text); }
  .category-tag {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 1px 9px;
    border-radius: 999px;
    color: var(--text);
  }
  .category-ai { background: var(--tag-ai-bg); }
  .category-anchor { background: var(--tag-anchor-bg); }
  .item a.title {
    display: block;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    margin: 8px 0 8px;
    line-height: 1.45;
  }
  .item a.title:hover { color: var(--accent); }
  .meta-left { display: inline-flex; align-items: center; gap: 6px; }
  .meta-left .source-type svg { width: 20px; height: 20px; display: block; }
  .meta-right {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .source-type {
    display: inline-flex;
  }
  .item p { margin: 0; font-size: 1.05rem; color: var(--text); }
  .tag-row { display: inline-flex; gap: 6px; }
  .diff-tag {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--border); color: var(--muted);
  }
  .empty {
    grid-column: 1 / -1;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 20px 0;
  }
</style>
</head>
<body>
<header>
  <h1>月度 Digest</h1>
  <nav><a href="index.html">7日内关注</a> · <a class="active" href="digest.html">月度 Digest</a></nav>
  <select id="monthSelect"></select>
</header>
<main>
  <section class="track">
    <h2>本月精选</h2>
    <div id="contentTrack" class="track-items"></div>
  </section>
  <section class="track">
    <h2>GitHub 高分项目</h2>
    <div id="githubTrack" class="track-items"></div>
  </section>
</main>

<script>
async function loadMonths() {
  const res = await fetch('data/months.json');
  const { months } = await res.json();
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.addEventListener('change', () => loadMonth(sel.value));
  if (months.length) loadMonth(months[0]);
}

// 内联SVG,不依赖外部图片请求。YouTube用其播放按钮标志;播客/博客没有单一平台可代表,
// 分别用业内通用的播客图标、标准RSS图标(内容本来就是走RSS抓的,语义也对)。
const TYPE_ICON = {
  // YouTube标志用它真实的宽高比(宽矩形+居中播放三角),不是正方形,不然认不出来
  youtube: {
    label: 'YouTube',
    svg: '<svg width="34" height="24" viewBox="0 0 28 20"><rect width="28" height="20" rx="4" fill="#FF0000"/><path d="M11 6l8 4-8 4V6z" fill="#fff"/></svg>',
  },
  // 播客用标准麦克风图标(话筒+支架),比之前的广播弧线更清楚
  podcast: {
    label: '播客',
    svg: '<svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#8B5CF6"/><rect x="10" y="5" width="4" height="9" rx="2" fill="#fff"/><path d="M7 11a5 5 0 0 0 10 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/><line x1="12" y1="16" x2="12" y2="19" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="19" x2="15" y2="19" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>',
  },
  // 标准RSS图标:圆点+两条同心弧,弧线圆心精确对齐圆点位置(标准RSS图标的画法)
  blog: {
    label: '文章',
    svg: '<svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FF8C00"/><rect x="5.5" y="4" width="13" height="16" rx="1.5" fill="#fff"/><line x1="8" y1="8.5" x2="15.5" y2="8.5" stroke="#FF8C00" stroke-width="1.4" stroke-linecap="round"/><line x1="8" y1="11.8" x2="15.5" y2="11.8" stroke="#FF8C00" stroke-width="1.4" stroke-linecap="round"/><line x1="8" y1="15.1" x2="12.5" y2="15.1" stroke="#FF8C00" stroke-width="1.4" stroke-linecap="round"/></svg>',
  },
  // X用官方"X"标志(黑底白字)，跟平台本身的品牌一致
  x: {
    label: 'X',
    svg: '<svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#000"/><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
  },
};

const TRACK_LABEL = { ai: 'AI', anchor: '锚点' };
const TIER_LABEL = { high: 'High', medium: 'Medium' };

function renderContentItem(item, latestDate) {
  const desc = item.summary || (item.tracks[0] && item.tracks[0].reason) || '';
  const type = TYPE_ICON[item.source_type] || { svg: '🔗', label: item.source_type || '' };
  const latestClass = item.first_seen === latestDate ? ' today' : '';
  // 月度归档只留high档,tracks里全部都是high,推荐程度标签固定显示High
  const categoryTags = item.tracks.map(t => `<span class="category-tag category-${t.track}">${TRACK_LABEL[t.track]}</span>`).join('');
  return `
    <div class="item high${latestClass}">
      <div class="item-meta">
        <span class="meta-left">
          <span class="source-type" title="${type.label}">${type.svg}</span>
          ${item.person} · ${item.date}
        </span>
        <span class="meta-right">
          ${categoryTags}
          <span class="tier-tag tier-high">${TIER_LABEL.high}</span>
        </span>
      </div>
      <a class="title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
      <p>${desc}</p>
    </div>
  `;
}

function renderContentTrack(items, latestDate) {
  const el = document.getElementById('contentTrack');
  el.innerHTML = items.length
    ? items.map(i => renderContentItem(i, latestDate)).join('')
    : '<div class="empty">这个月没有归档内容</div>';
}

// "today"高亮要跟真实日期比，不能跟这个月归档里的最大日期比——否则本月很久没有新增
// high档内容时，会把其实是几天/几周前的"月内最新一条"误标成"刚更新"(2026-08-16改，
// 跟index.html同一处修复)。比对用的是first_seen(pipeline实际收录日期)，不是date
// (published，作者原始发布日期)——两者常有一天时差，见index.html同一处的注释。
function todayUTC() {
  return new Date().toISOString().slice(0, 10);
}

const DIFFICULTY_LABEL = { beginner: '入门', intermediate: '进阶', advanced: '较难' };

function renderRepo(repo) {
  const diffTag = repo.difficulty
    ? `<span class="diff-tag">${DIFFICULTY_LABEL[repo.difficulty] || repo.difficulty}</span>`
    : '';
  const stars = repo.stars_total != null ? `★ ${repo.stars_total.toLocaleString()}` : '';
  return `
    <div class="item high">
      <div class="item-meta">
        <span>${repo.language || ''} · ${stars}</span>
        <span class="tag-row">${diffTag}<span class="tier-tag tier-high">${TIER_LABEL.high}</span></span>
      </div>
      <a class="title" href="${repo.url}" target="_blank" rel="noopener">${repo.full_name}</a>
      <p>${repo.recommend_reason || repo.description || ''}</p>
    </div>
  `;
}

function renderGithubTrack(repos) {
  const el = document.getElementById('githubTrack');
  el.innerHTML = repos.length
    ? repos.map(renderRepo).join('')
    : '<div class="empty">这个月没有发现值得关注的项目</div>';
}

async function loadMonth(month) {
  const res = await fetch(`data/digest_${month}.json`);
  const data = await res.json();
  const latestDate = todayUTC();
  renderContentTrack(data.items, latestDate);
  renderGithubTrack(data.github_track || []);
}

loadMonths();
</script>
</body>
</html>
