<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trending · Daily Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Sorts+Mill+Goudy&display=swap">
<style>
  /* 2026-11-15 从 Recent 页底部拆出来的独立页(Recent 下拉菜单里的 Trending)。横栏、页头、颜色跟 index.html 同一套。
     公开站也放这一页：export_public.py 把它跟 index.html 一起导出，横栏换成只有 Recent / Trending 的版本 */
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    --bg: #FAF9F5; --ink: #16150F; --soft: #4E4C46; --who: #6E6C65; --faint: #9C9990;
    --rule: #E6E2D8; --rule-strong: #C9C5BB; --accent: #B5442D; --hover: #F1EEE6;
    --date: #CC785C;
    --title: "Iowan Old Style", "Sorts Mill Goudy", "PingFang SC", Georgia, serif;
    --up: #3F7D4E;
  }
  @font-face {
    font-family: "CJK Quotes";
    src: local("PingFangSC-Regular"), local("PingFang SC Regular");
    unicode-range: U+201C-201D;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.9; letter-spacing: .02em;
  }
  a { color: inherit; text-decoration: none; }

  .top { max-width: 1208px; margin: 0 auto; padding: 34px 24px 0; line-height: 1.6; letter-spacing: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .top .mark { font-family: "Libre Baskerville", "Baskerville", Georgia, serif; font-size: 20px; letter-spacing: 0; }
  .top nav { display: flex; gap: 30px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
             font-family: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", sans-serif; }
  .top nav a:hover, .top nav a.on { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

  /* ---- Recent 下拉子菜单(2026-11-15)：鼠标停在 Recent 上才竖着展开 Digest / X / Trending，移开就收起
     (用户要的，在这三页里也不常驻)；当前页深色、其余灰。手机没有悬停，只在这三页里常驻，不然到不了 X/Trending。
     绝对定位，不撑高横栏，切页时 logo 和导航不跳 ---- */
  .top nav .grp { position: relative; }
  .top nav .sub { position: absolute; left: 0; top: 100%; z-index: 10; padding-top: 12px;
                  display: flex; flex-direction: column; gap: 4px; white-space: nowrap;
                  font-size: 14px; letter-spacing: .02em; text-transform: none;
                  opacity: 0; visibility: hidden; transform: translateY(-4px);
                  transition: opacity .18s ease, transform .18s ease, visibility .18s; }
  .top nav .grp:hover .sub, .top nav .grp:has(:focus-visible) .sub { opacity: 1; visibility: visible; transform: none; }
  @media (hover: none) { .top nav .grp.here .sub { opacity: 1; visibility: visible; transform: none; } }
  .top nav .sub a, .top nav .sub a:hover, .top nav .sub a.on { color: var(--faint); text-decoration: none; transition: color .15s; }
  .top nav .sub a:hover, .top nav .sub a.on { color: var(--ink); }
  @media (max-width: 760px) {
    .top { flex-wrap: wrap; row-gap: 14px; padding-left: 16px; padding-right: 16px; }
    .top nav { width: 100%; justify-content: space-between; gap: 0; font-size: 11.5px; }
  }

  .page { max-width: 892px; margin: 0 auto; padding: 96px 16px 120px; }
  /* 窄屏上 Recent 的子菜单常驻在横栏下面，页头往下让一让，不跟子菜单挤在一起 */
  @media (max-width: 760px) and (hover: none) { .page { padding-top: 132px; } }
  .mast { margin-bottom: 36px; }
  .mast h1 { font-family: "Libre Baskerville", "Baskerville", Georgia, serif; font-weight: 400; font-size: 14px;
             letter-spacing: .24em; text-transform: uppercase; margin: 0; color: var(--soft); line-height: 1.6; }
  .mast .lede { margin: 8px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--faint); letter-spacing: .02em; }
  .empty { color: var(--faint); font-size: .95rem; padding: 14px 0; }

  /* 一个仓库一行：owner / 名字、中文简介(完整显示，2026-11-14 用户要的)、语言 · 总星数 · 本周新增 */
  #gh { border-top: 1px solid var(--rule-strong); }
  .repo { display: block; padding: 22px 0; border-bottom: 1px solid var(--rule); }
  .repo:last-child { border-bottom: 0; }
  .repo .name { font-family: var(--title); font-size: 20px; line-height: 1.4; color: var(--ink); -webkit-text-stroke: .2px currentColor; word-break: break-all; }
  .repo .name span { color: var(--faint); -webkit-text-stroke: 0; }
  .repo .name a:hover { text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
  .repo .txt { margin: 8px 0 10px; font-family: "CJK Quotes", var(--sans); color: var(--soft); font-size: 15px; line-height: 1.85; text-align: justify; }
  .repo .meta { display: flex; gap: 14px; font-size: 12px; color: var(--faint); letter-spacing: .04em; }
  .repo .meta .up { color: var(--up); font-weight: 600; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .repo { animation: rise .45s ease backwards; animation-delay: calc(var(--d, 0) * 40ms); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
    <a class="mark" href="index.html">Daily Digest</a>
    <nav>
      <div class="grp here">
        <a href="index.html" class="on">Recent</a>
        <div class="sub">
          <a href="index.html">Digest</a>
          <a href="x.html">X</a>
          <a href="trending.html" class="on">Trending</a>
        </div>
      </div>
      <a href="companies.html">Companies</a>
      <a href="albums.html">People</a>
      <a href="digest.html">Archive</a>
    </nav>
</header>
<div class="page">
  <header class="mast">
    <h1>Trending</h1>
    <p class="lede">本周在涨的仓库 · <span id="lede"></span></p>
  </header>
  <main id="gh"></main>
</div>

<!--SITE-CONFIG-->
<script>
// 跟 index.html 一样：公开站由 export_public.py 在 SITE-CONFIG 标记那行注入 window.PUBLIC_SITE=true
const IS_PUBLIC = !!window.PUBLIC_SITE;
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// ---- 阅读记录：跟 index.html 同一个 Worker，area 记 'gh'(拆页前在 Recent 页底部也是这么记的)。公开站不发 ----
const TRACK_URL = 'https://digest-clicks.yyeees.workers.dev';
const PAGE_ID = Math.random().toString(36).slice(2, 10);
function track(ev) {
  if (IS_PUBLIC) return;
  try { navigator.sendBeacon(TRACK_URL, new Blob([JSON.stringify({ ...ev, page: PAGE_ID })], { type: 'text/plain' })); }
  catch (e) { /* 记不上就算了，不能影响阅读 */ }
}
function onLinkPress(e) {
  if (e.type === 'auxclick' && e.button !== 1) return;
  const a = e.target.closest && e.target.closest('a[target="_blank"]');
  if (a) track({ type: 'click', link: a.getAttribute('href'), area: 'gh',
                 how: e.type === 'auxclick' || e.metaKey || e.ctrlKey ? 'newtab' : 'click' });
}
document.addEventListener('click', onLinkPress);
document.addEventListener('auxclick', onLinkPress);

async function loadTrending() {
  const data = await (await fetch('data/trending.json')).json();
  document.getElementById('lede').textContent = `${data.items.length} 个`;
  document.getElementById('gh').innerHTML = data.items.map((i, k) => {
    const [owner, name] = i.full_name.split('/');
    return `<div class="repo" style="--d:${Math.min(k, 12)}">
      <div class="name"><a href="${esc(i.url)}" target="_blank" rel="noopener"><span>${esc(owner)} / </span>${esc(name)}</a></div>
      <div class="txt">${esc(i.recommend_reason || i.description || '')}</div>
      <div class="meta">${i.language ? `<span>${esc(i.language)}</span>` : ''}<span>★ ${(i.stars_total || 0).toLocaleString()}</span>
        ${i.stars_period ? `<span class="up">本周 +${i.stars_period.toLocaleString()}</span>` : ''}</div></div>`;
  }).join('') || '<div class="empty">还没有数据</div>';
  track({ type: 'view', area: 'gh', links: data.items.map(i => i.url) });
}
loadTrending();
</script>
</body>
</html>
