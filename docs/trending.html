<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Trending · Daily Digest</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --text: #1f1d1a;
    --muted: #767267;
    --border: #e7e3da;
    --accent: #b5502f;
    --high: #b5502f;
    --medium: #8a8474;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Noto Serif SC", "PingFang SC", "Songti SC", serif;
    line-height: 1.75;
  }
  header {
    padding: 24px 24px 10px;
    max-width: 1080px;
    width: 94%;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; margin: 0 0 14px; font-weight: 700; }
  nav {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--accent); }
  nav a.active { color: var(--text); font-weight: 600; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; }
  select {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.95rem;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  main { max-width: 1080px; width: 94%; margin: 0 auto; padding: 10px 24px 60px; }
  .items {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  @media (min-width: 760px) {
    .items { grid-template-columns: 1fr 1fr; }
  }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 0;
  }
  .item.medium { opacity: 0.88; }
  .item-meta {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .tag-row { display: inline-flex; gap: 6px; }
  .tag {
    font-family: -apple-system, "PingFang SC", sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
  }
  .tier-high { background: var(--high); }
  .tier-medium { background: var(--medium); }
  .diff-tag { background: var(--border); color: var(--muted); }
  .item a.title {
    display: block;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    margin: 8px 0 8px;
    line-height: 1.45;
  }
  .item a.title:hover { color: var(--accent); }
  .item p { margin: 0; font-size: 1.05rem; color: #45423c; }
  .empty {
    grid-column: 1 / -1;
    font-family: -apple-system, "PingFang SC", sans-serif;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 20px 0;
  }
</style>
</head>
<body>
<header>
  <h1>GitHub Trending · AI项目</h1>
  <nav><a href="index.html">Digest</a> · <a class="active" href="trending.html">GitHub Trending</a></nav>
  <div class="filters">
    <select id="tierFilter">
      <option value="">值得关注程度：全部</option>
      <option value="high">重点</option>
      <option value="medium">值得一看</option>
    </select>
    <select id="difficultyFilter">
      <option value="">难度：全部</option>
      <option value="beginner">入门</option>
      <option value="intermediate">进阶</option>
      <option value="advanced">较难</option>
    </select>
  </div>
</header>
<main>
  <div id="items" class="items"></div>
</main>

<script>
const DIFFICULTY_LABEL = { beginner: '入门', intermediate: '进阶', advanced: '较难' };

let allItems = [];

function renderItem(item) {
  const diffTag = item.difficulty
    ? `<span class="tag diff-tag">${DIFFICULTY_LABEL[item.difficulty] || item.difficulty}</span>`
    : '';
  const stars = item.stars_total != null ? `★ ${item.stars_total.toLocaleString()}` : '';
  return `
    <div class="item ${item.worth_tier}">
      <div class="item-meta">
        <span>${item.language || ''} · ${stars} · 首次发现 ${item.first_seen_date}</span>
        <span class="tag-row">
          ${diffTag}
          <span class="tag tier-${item.worth_tier}">${item.worth_tier === 'high' ? '重点' : '值得一看'}</span>
        </span>
      </div>
      <a class="title" href="${item.url}" target="_blank" rel="noopener">${item.full_name}</a>
      <p>${item.recommend_reason || item.description || ''}</p>
    </div>
  `;
}

function render() {
  const tier = document.getElementById('tierFilter').value;
  const difficulty = document.getElementById('difficultyFilter').value;
  const filtered = allItems.filter(i =>
    (!tier || i.worth_tier === tier) && (!difficulty || i.difficulty === difficulty)
  );
  const el = document.getElementById('items');
  el.innerHTML = filtered.length
    ? filtered.map(renderItem).join('')
    : '<div class="empty">没有符合条件的项目</div>';
}

async function load() {
  const res = await fetch('data/trending.json');
  const data = await res.json();
  allItems = data.items;
  document.getElementById('tierFilter').addEventListener('change', render);
  document.getElementById('difficultyFilter').addEventListener('change', render);
  render();
}

load();
</script>
</body>
</html>
