<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>常读的人 · Daily Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=League+Spartan:wght@700&display=swap">
<style>
  /* ============================================================
     常读的人 —— 反复回去读的几个人，每人一张卡片。
     版式参考 tetragrammaton.com/playlists：单栏、方形封面、衬线标题、卡片之间一条细线、大量留白。
     数据：data/albums.json(scripts/export_albums.py)。
     封面：公开网络上能代表这个人的图(本人网站头图/标志/插画)。不用黑白人像照(不吉利)，
           黑白风景、插画可以。图挂了退回下面JS画的线稿。
     更新提示：有新文章时，封面右上角垂下一条红色书签丝带，日期前多一个红点。"看过"记在本浏览器。
     按钮直接打开最新一篇原文(Thorsten的信去卷轴页)。
     只在全量站。export_public.py不导出这个页面。
     ============================================================ */
  :root {
    --bg: #FFFFFF; --ink: #111111; --soft: #4A4A4A; --faint: #8A8A8A; --rule: #111111;
    --red: #9E2F22; --red-dark: #7A2218;
    --serif: "Libre Baskerville", "Baskerville", "Songti SC", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
  a { color: inherit; }

  .top { max-width: 1160px; margin: 0 auto; padding: 34px 24px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .mark { font-family: var(--serif); font-size: 20px; text-decoration: none; }
  .top nav { display: flex; gap: 30px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .top nav a { text-decoration: none; }
  .top nav a:hover, .top nav a.on { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

  .intro { max-width: 440px; margin: 0 auto; padding: 96px 24px 32px; }
  .intro h1 { font-family: var(--serif); font-weight: 400; font-size: 14px; letter-spacing: .24em; text-transform: uppercase; margin: 0; color: var(--soft); }
  .intro p { margin: 8px 0 0; color: var(--faint); font-size: 13.5px; }

  /* ---------------- 一张卡片 ---------------- */
  .divider { max-width: 1040px; margin: 0 auto; border: 0; border-top: 1px solid var(--rule); width: calc(100% - 48px); }
  .card { max-width: 440px; margin: 0 auto; padding: 44px 24px 48px; }

  .cover-link { position: relative; display: block; aspect-ratio: 1 / 1; text-decoration: none; }
  .cover { position: absolute; inset: 0; overflow: hidden; background: #EFE9E0; }
  .cover img, .cover svg { transition: transform .8s ease; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-link:hover .cover img, .cover-link:hover .cover svg { transform: scale(1.02); }
  .cover svg { display: block; width: 100%; height: 100%; }

  /* 有新文章：封面右上角垂下一条书签丝带 */
  .ribbon {
    position: absolute; z-index: 2; top: -10px; right: 28px; width: 22px; height: 0;
    background: linear-gradient(90deg, var(--red-dark), var(--red) 45%, #B4483A 60%, var(--red));
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 9px), 0 100%);
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
    transition: height .9s cubic-bezier(.2,.8,.2,1) .2s;
  }
  .card.fresh .ribbon { height: 78px; }
  .card.fresh .cover-link:hover .ribbon { height: 92px; transition-delay: 0s; }
  .ribbon::before {   /* 丝带从封面上沿"夹"进去的那一道折痕 */
    content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: rgba(0,0,0,.18);
  }

  .title { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.25; margin: 30px 0 0; }
  .pub { font-family: var(--serif); font-style: italic; color: var(--soft); font-size: 15px; margin: 6px 0 0; }
  .date { margin: 14px 0 0; font-size: 15px; }
  .date .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-right: 8px; vertical-align: 2px; }
  .date .new { color: var(--red); font-size: 13px; letter-spacing: .06em; margin-left: 8px; }
  .latest { margin: 6px 0 0; font-size: 14.5px; color: var(--ink); line-height: 1.55; }
  .latest::before { content: "最新　"; color: var(--faint); }
  .bio { margin: 14px 0 0; color: var(--soft); font-size: 14.5px; line-height: 1.85; text-align: justify; }
  .go { display: inline-block; margin-top: 16px; font-size: 15px; color: var(--soft); text-decoration: none; }
  .go span { display: inline-block; margin-left: 6px; transition: transform .2s; }
  .go:hover { color: var(--ink); }
  .go:hover span { transform: translateX(4px); }

  .foot { text-align: center; color: var(--faint); font-size: 13px; padding: 30px 24px 90px; }

  @media (max-width: 640px) {
    .top { flex-wrap: wrap; row-gap: 14px; }
    .top nav { width: 100%; justify-content: space-between; gap: 0; }
    .top nav { gap: 16px; font-size: 12px; }
    .intro { padding-top: 56px; }
    .card { padding: 36px 16px 40px; }
    .title { font-size: 26px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; transition-delay: 0s !important; } }
</style>
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html">Daily Digest</a>
    <nav>
      <a href="index.html">Recent</a>
      <a href="companies.html">Companies</a>
      <a href="albums.html" class="on">People</a>
      <a href="digest.html">Archive</a>
    </nav>
  </header>
  <section class="intro">
    <h1>People</h1>
    <p>反复回去读的几个人。有新文章的，封面上会垂下一条书签。</p>
  </section>
  <main id="wall"></main>
  <p class="foot" id="foot"></p>

<script>
const SEEN_KEY = 'albums-seen-v1';   // { person: 'YYYY-MM-DD' 上次点开时他的最新一篇日期 }
const NEW_WINDOW_DAYS = 7;           // 从没点开过的：7天内有更新就算新
const loadSeen = () => { try { return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch (e) { return {}; } };
const saveSeen = s => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(s)); } catch (e) {} };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtLong = iso => { const [y, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };
const daysAgo = iso => (Date.now() - new Date(iso + 'T00:00:00Z').getTime()) / 864e5;

// ---------------- 备用封面：图片加载失败时用的线稿 ----------------
const INK = '#151515';
function frame(inner, a, idx) {
  return `<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(a.person)} 封面">
    <defs>
      <radialGradient id="g${idx}" cx="45%" cy="38%" r="80%">
        <stop offset="0" stop-color="#F7EFE2"/><stop offset=".7" stop-color="#EFE4D2"/><stop offset="1" stop-color="#E4D6BF"/>
      </radialGradient>
      <filter id="grain${idx}"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .09 0"/></filter>
    </defs>
    <rect width="600" height="600" fill="url(#g${idx})"/>
    <rect width="600" height="600" filter="url(#grain${idx})"/>
    <text x="40" y="58" font-family="Libre Baskerville, Georgia, serif" font-size="13" fill="#8A7E6B" letter-spacing="2">N°${String(idx + 1).padStart(2, '0')}</text>
    <text x="560" y="58" text-anchor="end" font-family="Libre Baskerville, Georgia, serif" font-style="italic" font-size="14" fill="#8A7E6B">${esc(initials(a.person))}</text>
    <g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${inner}</g>
    <text x="300" y="556" text-anchor="middle" font-family="Helvetica Neue, Helvetica, sans-serif" font-size="12" fill="#6F6455" letter-spacing="5">${esc(a.pub.toUpperCase())}</text>
  </svg>`;
}
const initials = name => name.split(/\s+/).map(w => w[0]).join('.') + '.';

// 名字字标封面(Andy)：照他网站顶部的字标，左上起两行粗体名字，满版底色
function wordmark(a) {
  const words = a.person.split(/\s+/);
  const size = 96;
  const lines = words.map((w, i) => `<text x="58" y="${262 + i * size * 1.02}" font-size="${size}">${esc(w)}</text>`).join('');
  return `<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(a.person)}">
    <rect width="600" height="600" fill="${esc(a.bg || '#FDF3F1')}"/>
    <g fill="${esc(a.ink || '#360EF5')}" font-family="'League Spartan', Futura, 'Avenir Next', 'Helvetica Neue', sans-serif" font-weight="700" letter-spacing="-2">${lines}</g>
  </svg>`;
}

const COVERS = {
  // Craig Mod：山脊线 + 一条虚线小路爬上去 + 太阳
  ridge() {
    const ridge = 'M70 380 L150 300 L195 335 L265 225 L320 290 L360 255 L430 330 L470 300 L530 380';
    const ridge2 = 'M70 410 L130 370 L210 400 L290 345 L380 395 L450 360 L530 410';
    const trail = 'M120 470 C200 455 215 420 250 400 S300 330 265 225';
    return `<path d="${ridge}"/><path d="${ridge2}" stroke-width="1.6" opacity=".7"/>
      <path d="${trail}" stroke-width="2.4" stroke-dasharray="2 12"/>
      <circle cx="415" cy="170" r="44"/><circle cx="265" cy="225" r="5" fill="${INK}"/>
      <path d="M70 470 L530 470" stroke-width="1.4" opacity=".5"/>`;
  },
  // Thorsten Ball：从一点射向四面八方的链接，端点是小圆 —— 每周十几处去向
  rays() {
    let s = '<circle cx="300" cy="290" r="9" fill="' + INK + '"/>';
    const n = 16;
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 - Math.PI / 2 + (i % 2 ? .08 : -.05);
      const len = [190, 120, 165, 95, 205, 140, 110, 175, 150, 100, 195, 130, 160, 90, 180, 125][i];
      const x = 300 + Math.cos(ang) * len, y = 290 + Math.sin(ang) * len;
      const x0 = 300 + Math.cos(ang) * 22, y0 = 290 + Math.sin(ang) * 22;
      s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)}" stroke-width="${i % 3 ? 2 : 3}"/>`;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i % 4 ? 6 : 9}" ${i % 5 === 0 ? 'fill="' + INK + '"' : ''}/>`;
    }
    return s;
  },
  // Dan Koe：向内收拢的螺旋 —— 专注
  spiral() {
    let d = '';
    const turns = 5.2, steps = 520;
    for (let k = 0; k <= steps; k++) {
      const t = (k / steps) * turns * Math.PI * 2;
      const r = 8 + 32 * t / (Math.PI * 2) * 1.04;
      const x = 300 + Math.cos(t) * r, y = 285 + Math.sin(t) * r;
      d += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return `<path d="${d}" stroke-width="2.4"/><circle cx="300" cy="285" r="6" fill="${INK}"/>`;
  },
  // Teo Crawford：相机光圈的六片叶片
  aperture() {
    const cx = 300, cy = 285, R = 175, r = 62, n = 6;
    let s = `<circle cx="${cx}" cy="${cy}" r="${R}"/><circle cx="${cx}" cy="${cy}" r="${R + 14}" stroke-width="1.4" opacity=".6"/>`;
    const pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + .3; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    for (let i = 0; i < n; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n];
      // 沿着内六边形的边往外延伸，直到碰到外圆
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const fx = x1 - cx, fy = y1 - cy, b = fx * ux + fy * uy, c = fx * fx + fy * fy - R * R;
      const t = -b + Math.sqrt(b * b - c);
      s += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${(x1 + ux * t).toFixed(1)} ${(y1 + uy * t).toFixed(1)}"/>`;
    }
    s += `<path d="M${pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L')} Z" stroke-width="2"/>`;
    return s;
  },
  // Andy Matuschak：彼此链接的常青笔记
  nodes() {
    const N = [[300, 170], [200, 230], [395, 225], [150, 330], [262, 300], [355, 320], [450, 330], [205, 420], [310, 410], [420, 430], [300, 500 - 40]];
    const E = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6], [4, 5], [3, 7], [4, 8], [5, 8], [6, 9], [8, 9], [7, 10], [8, 10], [4, 7], [5, 9]];
    let s = E.map(([a, b]) => `<path d="M${N[a][0]} ${N[a][1]} L${N[b][0]} ${N[b][1]}" stroke-width="1.8"/>`).join('');
    s += N.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${[0, 4, 8].includes(i) ? 15 : 10}" fill="${[0, 8].includes(i) ? INK : '#F3EADB'}"/>`).join('');
    return s;
  },
};

function isFresh(a, seen) {
  if (!a.latest) return false;
  if (seen[a.person]) return a.latest > seen[a.person];
  return daysAgo(a.latest) <= NEW_WINDOW_DAYS;
}

let ALBUMS = [];
function render() {
  const seen = loadSeen();
  document.getElementById('wall').innerHTML = ALBUMS.map((a, idx) => {
    const fresh = isFresh(a, seen);
    const internal = false;
    const target = internal ? '' : ' target="_blank" rel="noopener"';
    const cover = a.cover === 'wordmark' ? wordmark(a) : a.image
      ? `<img src="${esc(a.image)}" alt="${esc(a.person)}" loading="lazy" referrerpolicy="no-referrer" data-idx="${idx}">`
      : frame(COVERS[a.cover] ? COVERS[a.cover]() : '', a, idx);
    return `<hr class="divider">
    <article class="card${fresh ? ' fresh' : ''}" data-person="${esc(a.person)}" data-latest="${esc(a.latest || '')}">
      <a class="cover-link" href="${esc(a.latest_link)}"${target} aria-label="${esc(a.verb)}：${esc(a.latest_title || a.person)}">
        <span class="ribbon" aria-hidden="true"></span>
        <div class="cover">${cover}</div>
      </a>
      <h2 class="title">${esc(a.person)}</h2>
      <p class="pub">${esc(a.pub)}</p>
      <p class="date">${fresh ? '<span class="dot"></span>' : ''}${a.latest ? fmtLong(a.latest) : '—'}${fresh ? '<span class="new">新篇</span>' : ''}</p>
      ${a.latest_title ? `<p class="latest">${esc(a.latest_title)}</p>` : ''}
      <p class="bio">${esc(a.bio)}</p>
      <a class="go" href="${esc(a.latest_link)}"${target}>${esc(a.verb)} Now<span>→</span></a>
    </article>`;
  }).join('') + '<hr class="divider">';
  // 图挂了(对方换地址、网络不通)：退回线稿封面
  document.querySelectorAll('.cover img').forEach(img => img.addEventListener('error', () => {
    const a = ALBUMS[+img.dataset.idx];
    img.parentElement.innerHTML = frame(COVERS[a.cover] ? COVERS[a.cover]() : '', a, +img.dataset.idx);
  }, { once: true }));
}

// 点封面或按钮去读：记下"看过了"，书签收起
document.addEventListener('click', e => {
  const link = e.target.closest('.cover-link, .go');
  if (!link) return;
  const card = link.closest('.card');
  const seen = loadSeen();
  seen[card.dataset.person] = card.dataset.latest;
  saveSeen(seen);
  setTimeout(() => card.classList.remove('fresh'), 300);
});

(async function init() {
  let data;
  try { data = await (await fetch('data/albums.json')).json(); }
  catch (e) { document.getElementById('wall').innerHTML = '<p class="foot">数据没读到。</p>'; return; }
  // 顺序由export_albums.py里ALBUMS的顺序决定(用户定的)，这里不重排
  ALBUMS = data.albums.slice();
  render();
  document.getElementById('foot').textContent = `${ALBUMS.length} 位`;
})();
</script>
</body>
</html>
