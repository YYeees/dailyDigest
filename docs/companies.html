<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>大公司 · Daily Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&display=swap">
<style>
  /* ============================================================
     大公司 —— Anthropic、OpenAI 这7天发了什么。
     几版之后(杂志式乱、错落拼贴晕、三栏丑)，用户从三种对比稿里挑了"晨报"：
     - 跟首页同一规则：只放medium/high；不分公司，按日期分组，同一天优先级高的在前
     - 左边大日期，右边当天的几篇：公司·标签一行、标题、中文摘要；有配图的放右侧小方块
     - 点公司名或标签可以筛选；没点开过的，公司名前一个红点
     数据：data/companies.json(scripts/export_companies.py)。只在全量站。
     ============================================================ */
  :root {
    --bg: #FAF9F5; --ink: #141413; --soft: #4D4C48; --faint: #8F8D86; --rule: #141413; --hair: #E3E0D6;
    --red: #B5442D;
    --anthropic: #C96442; --openai: #141413;
    --serif: "Libre Baskerville", "Baskerville", "Songti SC", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .top { max-width: 1180px; margin: 0 auto; padding: 34px 28px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .mark { font-family: var(--serif); font-size: 20px; }
  .top nav { display: flex; gap: 30px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .top nav a:hover, .top nav a.on { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  .intro { max-width: 860px; margin: 0 auto; padding: 96px 0 32px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .intro h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  .intro h1 em { color: var(--soft); }
  .intro .status { font-size: 14px; color: var(--soft); line-height: 1.7; text-align: right; flex: none; }
  .intro .status b { color: var(--red); font-weight: 600; }
  .intro .status button { color: var(--faint); font-size: 12.5px; }
  .intro .status button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------------- 晨报：按日期分组，左边大日期，右边当天的几篇 ---------------- */
  .list { max-width: 860px; margin: 0 auto; padding-bottom: 120px; }
  .day { display: grid; grid-template-columns: 120px 1fr; gap: 36px; padding: 32px 0 6px; border-top: 1px solid var(--rule); }
  .list .day:last-child { border-bottom: 1px solid var(--hair); }
  .d { font-family: var(--serif); font-size: 15px; color: var(--soft); }
  .d b { display: block; font-weight: 400; font-size: 46px; line-height: 1; color: var(--ink); margin-bottom: 4px; }
  .d .wk { display: block; margin-top: 6px; font-family: var(--sans); font-size: 12px; color: var(--faint); letter-spacing: .06em; }

  .item { display: grid; grid-template-columns: 1fr 150px; gap: 26px; padding-bottom: 28px; }
  .item + .item { border-top: 1px solid var(--hair); padding-top: 26px; }
  .item.noimg { grid-template-columns: 1fr; }
  .m { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .m .sep { margin: 0 2px; }
  .m .unread { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; }
  .co { font-weight: 600; letter-spacing: .12em; }
  .co.anthropic { color: var(--anthropic); }
  .co.openai { color: var(--openai); }
  .tg { letter-spacing: .12em; }
  .filterable { cursor: pointer; text-transform: uppercase; font-size: inherit; padding: 1px 0; border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
  .filterable:hover { border-bottom-color: currentColor; }
  .filterable.on { border-bottom-color: currentColor; color: var(--ink); }
  .item h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 1.32; margin: 8px 0 0; }
  .item.high h2 { font-size: 24px; }
  .item h2 a:hover { text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
  .item .sum { margin: 9px 0 0; color: var(--soft); font-size: 14.5px; line-height: 1.85; }
  .item.read h2 { color: var(--soft); }
  .pic { display: block; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 4px; background: #EDEAE0; margin-top: 4px; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
  .pic:hover img { transform: scale(1.04); }

  .filter-on { max-width: 860px; margin: 0 auto; padding: 0 0 14px; font-size: 13.5px; color: var(--soft); }
  .filter-on b { color: var(--ink); font-weight: 600; }
  .filter-on button { color: var(--faint); margin-left: 10px; }
  .filter-on button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .empty { color: var(--faint); font-family: var(--serif); font-style: italic; font-size: 20px; padding: 40px 0; }

  @media (max-width: 760px) {
    .top { flex-wrap: wrap; row-gap: 14px; }
    .top nav { width: 100%; justify-content: space-between; gap: 0; }
    .intro { display: block; padding: 64px 0 36px; }
    .intro .status { margin-top: 14px; text-align: left; }
    /* 窄屏：大日期变成每组上方的一行 */
    .day { grid-template-columns: 1fr; gap: 14px; padding-top: 22px; }
    .d b { display: inline; font-size: 30px; margin-right: 6px; }
    .d .wk { display: inline; margin-left: 8px; }
    .item { grid-template-columns: 1fr 84px; gap: 16px; }
    .item h2, .item.high h2 { font-size: 19px; }
    .item .sum { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html">Daily Digest</a>
    <nav>
      <a href="index.html">Recent</a>
      <a href="albums.html">People</a>
      <a href="companies.html" class="on">Companies</a>
      <a href="letter.html">Letters</a>
    </nav>
  </header>
  <div class="wrap">
    <section class="intro">
      <div class="hd"><h1 id="headline">这 7 天，<em>Anthropic</em> 和 <em>OpenAI</em></h1></div>
      <div class="status" id="status"></div>
    </section>
    <div class="filter-on" id="filterOn" hidden></div>
    <main class="list" id="list"></main>
  </div>

<script>
const SEEN_KEY = 'companies-seen-v1';   // [link, ...] 点开过的
const loadSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } };
const saveSeen = s => { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...s])); } catch (e) {} };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = iso => { const [, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}`; };
const RANK = { high: 3, medium: 2, low: 1 };

let DATA = null;
let FILTER = null;   // { kind: 'company' | 'tag', value }

const matches = it => !FILTER
  || (FILTER.kind === 'company' && it.key === FILTER.value)
  || (FILTER.kind === 'tag' && (it.tags || []).includes(FILTER.value));

function render() {
  const seen = loadSeen();
  const all = DATA.items.slice().sort((a, b) =>
    b.date.localeCompare(a.date) || (RANK[b.priority] || 0) - (RANK[a.priority] || 0));
  const unread = all.filter(it => !seen.has(it.link)).length;
  document.getElementById('status').innerHTML = all.length
    ? `一共 ${all.length} 篇${unread ? `，还有 <b>${unread}</b> 篇没看<br><button type="button" id="markAll">全部标为已读</button>` : '，都看过了'}`
    : '';

  const fo = document.getElementById('filterOn');
  if (FILTER) {
    const label = FILTER.kind === 'company' ? (DATA.companies.find(c => c.key === FILTER.value) || {}).name : FILTER.value;
    fo.innerHTML = `只看 <b>${esc(label)}</b><button type="button" id="clearFilter">看全部</button>`;
    fo.hidden = false;
  } else { fo.hidden = true; }

  const items = all.filter(matches);
  if (!all.length) { document.getElementById('list').innerHTML = '<p class="empty">这 7 天两家都没发什么。</p>'; return; }
  if (!items.length) { document.getElementById('list').innerHTML = '<p class="empty">这个筛选下没有内容。</p>'; return; }

  const byDay = {};
  items.forEach(it => (byDay[it.date] = byDay[it.date] || []).push(it));
  const WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('list').innerHTML = Object.keys(byDay).sort().reverse().map(day => {
    const [y, m, dd] = day.split('-').map(Number);
    const wk = WK[new Date(y, m - 1, dd).getDay()];
    return `<section class="day">
      <div class="d"><b>${dd}</b>${MONTHS[m - 1]}<span class="wk">${wk}</span></div>
      <div>${byDay[day].map(it => {
        const read = seen.has(it.link);
        const cls = ['item', it.priority || 'low', it.image ? '' : 'noimg', read ? 'read' : ''].join(' ');
        const coOn = FILTER && FILTER.kind === 'company' && FILTER.value === it.key ? ' on' : '';
        const tags = (it.tags || []).map(t => {
          const on = FILTER && FILTER.kind === 'tag' && FILTER.value === t ? ' on' : '';
          return `<span class="sep">·</span><button type="button" class="tg filterable${on}" data-tag="${esc(t)}" title="只看 ${esc(t)}">${esc(t)}</button>`;
        }).join('');
        const link = `href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}"`;
        return `<article class="${cls}">
          <div>
            <div class="m">${read ? '' : '<span class="unread" title="还没看过"></span>'}<button type="button" class="co filterable ${esc(it.key)}${coOn}" data-company="${esc(it.key)}" title="只看 ${esc(it.company)}">${esc(it.company)}</button>${tags}</div>
            <h2><a ${link}>${esc(it.title)}</a></h2>
            ${it.summary ? `<p class="sum">${esc(it.summary)}</p>` : ''}
          </div>
          ${it.image ? `<a class="pic" ${link}><img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>` : ''}
        </article>`;
      }).join('')}</div>
    </section>`;
  }).join('');

  // 配图挂了：这一行变成没有图的
  document.querySelectorAll('.pic img').forEach(img => img.addEventListener('error', () => {
    const item = img.closest('.item');
    img.parentElement.remove();
    item.classList.add('noimg');
  }, { once: true }));
}

function toggleFilter(kind, value) {
  FILTER = FILTER && FILTER.kind === kind && FILTER.value === value ? null : { kind, value };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('click', e => {
  if (e.target.id === 'markAll') {
    const s = loadSeen(); DATA.items.forEach(it => s.add(it.link)); saveSeen(s); render(); return;
  }
  if (e.target.id === 'clearFilter') { FILTER = null; render(); return; }
  const co = e.target.closest('[data-company]');
  if (co) { toggleFilter('company', co.dataset.company); return; }
  const tg = e.target.closest('[data-tag]');
  if (tg) { toggleFilter('tag', tg.dataset.tag); return; }
  const a = e.target.closest('a[data-link]');
  if (a) { const s = loadSeen(); s.add(a.dataset.link); saveSeen(s); setTimeout(render, 300); }
});

(async function init() {
  try { DATA = await (await fetch('data/companies.json')).json(); }
  catch (e) { document.getElementById('list').innerHTML = '<p class="empty">数据没读到。</p>'; return; }
  render();
})();
</script>
</body>
</html>
