<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>大公司 · Daily Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Sorts+Mill+Goudy&display=swap">
<style>
  /* ============================================================
     大公司 —— Anthropic、OpenAI 这7天发了什么。
     几版之后(杂志式乱、错落拼贴晕、三栏丑)，用户从三种对比稿里挑了"晨报"：
     - 跟首页同一规则：只放medium/high；不分公司，按日期分组，同一天优先级高的在前
     - 左边大日期，右边当天的几篇：公司·标签一行、标题、中文摘要；有配图的放右侧小方块
     - 点公司名或标签可以筛选；没点开过的，公司名前一个红点
     数据：data/companies.json(scripts/export_companies.py)。只在全量站。
     ============================================================ */
  :root {
    /* 颜色层级(2026-11-14 统一定的)：标题是唯一主角；正文、公司名、标签/月份、大日期依次变淡；
       红色只给"未读"用。公司名不用品牌色——Anthropic的橙跟未读红挤在一起就乱了。 */
    --bg: #FAF9F5;
    --t1: #16150F;   /* 标题 */
    --t2: #4E4C46;   /* 摘要 */
    --t3: #6E6C65;   /* 公司名 */
    --t4: #9C9990;   /* 标签、月份、星期、页头说明 */
    --t5: #CC785C;   /* 左边大日期数字：土橙色(Anthropic 品牌里的 Book Cloth)，偏棕，用户点名要的 */
    --ink: var(--t1); --soft: var(--t2); --faint: var(--t4);
    --rule: #C9C5BB; --hair: #E6E2D8;
    --red: #B5442D;
    --serif: "Libre Baskerville", "Baskerville", "Songti SC", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .top { max-width: 1160px; margin: 0 auto; padding: 34px 24px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .mark { font-family: var(--serif); font-size: 20px; }
  .top nav { display: flex; gap: 30px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .top nav a:hover, .top nav a.on { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

  /* ---- Recent 下拉子菜单(2026-11-15)：鼠标停在 Recent 上才竖着展开 Digest / X / Trending，移开就收起
     (用户要的，在这三页里也不常驻)；当前页深色、其余灰。手机没有悬停，只在这三页里常驻，不然到不了 X/Trending。
     绝对定位，不撑高横栏，切页时 logo 和导航不跳 ---- */
  .top nav .grp { position: relative; }
  .top nav .sub { position: absolute; left: 0; top: 100%; z-index: 10; padding-top: 12px;
                  display: flex; flex-direction: column; gap: 4px; white-space: nowrap;
                  font-size: 14px; letter-spacing: .02em; text-transform: none;
                  opacity: 0; visibility: hidden; transform: translateY(-4px);
                  transition: opacity .18s ease, transform .18s ease, visibility .18s; }
  .top nav .grp:hover .sub, .top nav .grp:has(:focus-visible) .sub { opacity: 1; visibility: visible; transform: none; }
  @media (hover: none) { .top nav .grp.here .sub { opacity: 1; visibility: visible; transform: none; } }
  .top nav .sub a, .top nav .sub a:hover, .top nav .sub a.on { color: var(--faint); text-decoration: none; transition: color .15s; }
  .top nav .sub a:hover, .top nav .sub a.on { color: var(--ink); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  .intro { max-width: 860px; margin: 0 auto; padding: 96px 0 30px; }
  .intro h1 { font-family: var(--serif); font-weight: 400; font-size: 14px; letter-spacing: .24em; text-transform: uppercase; margin: 0; color: var(--t2); }
  .intro .status { margin: 8px 0 0; font-size: 13.5px; color: var(--faint); }

  .intro .status b { color: var(--red); font-weight: 600; }
  .intro .status button { color: var(--faint); font-size: inherit; }
  .intro .status button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------------- 晨报：按日期分组，左边大日期，右边当天的几篇 ---------------- */
  .list { max-width: 860px; margin: 0 auto; padding-bottom: 120px; }
  .day { display: grid; grid-template-columns: 120px 1fr; gap: 36px; padding: 32px 0 6px; border-top: 1px solid var(--rule); }
  .list .day:last-child { border-bottom: 1px solid var(--hair); }
  .d { font-family: var(--serif); font-size: 15px; color: var(--t4); }
  /* 大日期：Iowan Old Style 的旧式数字(oldstyle figures)，3/4/5/7/9 往下伸出一截"尾巴"。
     用户从8款对比里挑的。Iowan是苹果系统自带的，别的设备上用 Sorts Mill Goudy(Google Fonts，同类书籍衬线体)顶上。
     试过没用：EB Garamond(Google Fonts版本退回等高数字)、Playfair Display、Raleway。 */
  .d b { display: block; font-family: "Iowan Old Style", "Sorts Mill Goudy", var(--serif); font-weight: 400;
         font-size: 58px; line-height: 1; color: var(--t5); margin-bottom: 12px;
         font-variant-numeric: oldstyle-nums; font-feature-settings: "onum" 1; }
  .d .wk { display: block; margin-top: 6px; font-family: var(--sans); font-size: 12px; color: var(--faint); letter-spacing: .06em; }

  .item { display: grid; grid-template-columns: 1fr 150px; gap: 26px; padding-bottom: 28px; }
  .item + .item { border-top: 1px solid var(--hair); padding-top: 26px; }
  .item.noimg { grid-template-columns: 1fr; }
  .m { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .m .sep { margin: 0 2px; }
  .m .unread { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; }
  .co { font-weight: 500; letter-spacing: .12em; color: var(--t3); }
  .tg { letter-spacing: .12em; }
  .filterable { cursor: pointer; text-transform: uppercase; font-size: inherit; padding: 1px 0; border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
  .filterable:hover { border-bottom-color: currentColor; }
  .filterable.on { border-bottom-color: currentColor; color: var(--t1); }

  /* 「记一笔」(2026-11-18)：跟 Recent/Archive 同一个按钮——在写作收件箱(Obsidian vault writing-inbox)
     新建一条临时笔记，已记过的改成打开那条。放在公司·标签那一行的最右边。
     未记态悬停那一条才浮现，已记态一直显示；已记用土橙(--t5)，红色只给"未读"。 */
  .m .note-btn { margin-left: auto; }
  .note-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; color: var(--faint);
    border: 1px solid var(--rule); border-radius: 999px;
    opacity: 0; transition: opacity .15s, color .15s, border-color .15s, background .15s;
  }
  .note-btn svg { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }
  .note-btn:hover { color: var(--ink); border-color: var(--faint); }
  .item:hover .note-btn, .note-btn:focus-visible, .note-btn.noted { opacity: 1; }
  @media (hover: none) { .note-btn { opacity: 1; } }
  .note-btn.noted { color: var(--t5); border-color: transparent; }
  .note-btn.noted svg { fill: currentColor; }
  .note-btn.noted:hover { background: rgba(204, 120, 92, .1); }
  /* 标题跟大日期同一套：Iowan Old Style(苹果系统自带)，别的设备用 Sorts Mill Goudy */
  /* 标题要比公司名更醒目：近乎纯黑，再用极细的描边把Iowan偏细的笔画压实一点 */
  .item h2 { color: var(--t1); -webkit-text-stroke: .3px currentColor;
             font-family: "Iowan Old Style", "Sorts Mill Goudy", var(--serif); font-weight: 400; font-size: 24px; line-height: 1.3;
             margin: 8px 0 0; font-feature-settings: "onum" 1; }
  .item.high h2 { font-size: 26px; }
  .item h2 a:hover { text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
  .item .sum { margin: 9px 0 0; color: var(--soft); font-size: 14.5px; line-height: 1.85; }
  .item.read h2 { color: #46443E; }
  .pic { display: block; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 4px; background: #EDEAE0; margin-top: 4px; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
  .pic:hover img { transform: scale(1.04); }

  .filter-on { max-width: 860px; margin: 0 auto; padding: 0 0 14px; font-size: 13.5px; color: var(--soft); }
  .filter-on b { color: var(--ink); font-weight: 600; }
  .filter-on button { color: var(--faint); margin-left: 10px; }
  .filter-on button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .empty { color: var(--faint); font-family: var(--serif); font-style: italic; font-size: 20px; padding: 40px 0; }

  @media (max-width: 760px) {
    .top { flex-wrap: wrap; row-gap: 14px; }
    .top nav { width: 100%; justify-content: space-between; gap: 0; }
    .intro { padding: 56px 0 26px; }
    /* 窄屏：大日期变成每组上方的一行 */
    .day { grid-template-columns: 1fr; gap: 14px; padding-top: 22px; }
    .d b { display: inline; font-size: 30px; margin-right: 6px; }
    .d .wk { display: inline; margin-left: 8px; }
    .item { grid-template-columns: 1fr 84px; gap: 16px; }
    .item h2, .item.high h2 { font-size: 19px; }
    .item .sum { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html">Daily Digest</a>
    <nav>
      <div class="grp">
        <a href="index.html">Recent</a>
        <div class="sub">
          <a href="index.html">Digest</a>
          <a href="x.html">X</a>
          <a href="trending.html">Trending</a>
        </div>
      </div>
      <a href="companies.html" class="on">Companies</a>
      <a href="albums.html">People</a>
      <a href="digest.html">Archive</a>
    </nav>
  </header>
  <div class="wrap">
    <section class="intro">
      <h1>Companies</h1>
      <p class="status" id="status"></p>
    </section>
    <div class="filter-on" id="filterOn" hidden></div>
    <main class="list" id="list"></main>
  </div>

<script>
const SEEN_KEY = 'companies-seen-v1';   // [link, ...] 点开过的
const loadSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } };
const saveSeen = s => { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...s])); } catch (e) {} };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = iso => { const [, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}`; };
const RANK = { high: 3, medium: 2, low: 1 };

// ---- 「记一笔」：跟 index.html / digest.html 同一套(vault、笔记命名、localStorage 键都一样)，
// 所以同一篇在哪页记过，另几页也显示成已记。为什么要 noted 键、为什么点击后要 setTimeout 再改 href，
// 见 index.html 那段注释。属性用 data-note-link 而不是 data-link：data-link 会被下面当成"点开原文"标已读。
const INBOX_VAULT = 'writing-inbox';
const NOTED_KEY = 'digest-noted-links-v1';
const notedLinks = () => { try { return new Set(JSON.parse(localStorage.getItem(NOTED_KEY) || '[]')); } catch (e) { return new Set(); } };
function setNoted(link, on) {
  try {
    const s = notedLinks();
    if (on) { s.add(link); } else { s.delete(link); }
    localStorage.setItem(NOTED_KEY, JSON.stringify([...s]));
  } catch (e) { /* 记不住就下次再建一个，不该让点击失败 */ }
}
// 笔记日期用"记的那天"(本地时间)，不是文章发布日(2026-11-18 用户要的)。
// 名字跟着日期变，所以记下时把文件名存起来(NAMES_KEY)，之后"打开"按存的名字找；
// 存的名字丢了(在 Recent/Archive 页记的、或 localStorage 被清)就退回发布日命名——那两页还是按发布日起名。
const NAMES_KEY = 'companies-note-names-v1';   // { link: 笔记文件名 }
const loadNames = () => { try { return JSON.parse(localStorage.getItem(NAMES_KEY) || '{}'); } catch (e) { return {}; } };
function saveName(link, name) {
  try { const m = loadNames(); if (name) { m[link] = name; } else { delete m[link]; } localStorage.setItem(NAMES_KEY, JSON.stringify(m)); }
  catch (e) {}
}
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function inboxNoteName(it, date) {
  const slug = (it.title || '').trim()
    .replace(/[\\/:*?"<>|#^[\]]/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 60);
  return `${date} ${slug}`;
}
const notedName = it => loadNames()[it.link] || inboxNoteName(it, it.date);
const openHref = name => `obsidian://open?vault=${encodeURIComponent(INBOX_VAULT)}&file=${encodeURIComponent(name)}`;
function inboxHref(it, noted) {
  if (noted) return openHref(notedName(it));
  const today = todayISO();
  const name = inboxNoteName(it, today);
  const anchor = (it.title || '').trim().replace(/[[\]]/g, m => (m === '[' ? '(' : ')'));
  const from = (it.company || '').replace(/"/g, "'");
  // 链接下面带上页面上那段中文摘要(引用块)，写的时候不用再翻回来看。摘要必须在链接**之后**：
  // scan_inbox.py 取正文里第一个 markdown 链接去匹配 digest.db。
  const brief = (it.summary || '').trim().replace(/\s*\n\s*/g, ' ');
  const content = `---\nsource: "${from}"\ndate: ${today}\n---\n\n[${anchor}](${it.link})\n\n`
    + (brief ? `> ${brief}\n\n` : '');
  return `obsidian://new?vault=${encodeURIComponent(INBOX_VAULT)}`
    + `&name=${encodeURIComponent(name)}&content=${encodeURIComponent(content)}`;
}
const PEN_SVG = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">'
  + '<path d="M11.1 1.9a1.3 1.3 0 0 1 1.9 0l1.1 1.1a1.3 1.3 0 0 1 0 1.9l-7.6 7.6-3.4.9.9-3.4z"/></svg>';
function noteBtn(it, noted) {
  return `<a class="note-btn${noted ? ' noted' : ''}" href="${esc(inboxHref(it, noted))}"`
    + ` data-note-link="${esc(it.link)}" data-name="${esc(inboxNoteName(it, todayISO()))}"`
    + ` data-new-href="${esc(inboxHref(it, false))}"`
    + ` title="${noted ? '打开已记的那条笔记（右键取消标记）' : '在写作收件箱里记一笔'}">${PEN_SVG}</a>`;
}
// 右键取消已记：浏览器弹"是否打开Obsidian"时点了取消，页面收不到，右键给条退路
document.addEventListener('contextmenu', e => {
  const btn = e.target.closest && e.target.closest('.note-btn.noted');
  if (!btn) return;
  e.preventDefault();
  setNoted(btn.dataset.noteLink, false);
  saveName(btn.dataset.noteLink, null);
  btn.classList.remove('noted');
  btn.href = btn.dataset.newHref;
  btn.title = '在写作收件箱里记一笔（点了没反应？右键可取消标记）';
});

let DATA = null;
let FILTER = null;   // { kind: 'company' | 'tag', value }

const matches = it => !FILTER
  || (FILTER.kind === 'company' && it.key === FILTER.value)
  || (FILTER.kind === 'tag' && (it.tags || []).includes(FILTER.value));

function render() {
  const seen = loadSeen();
  const noted = notedLinks();
  const all = DATA.items.slice().sort((a, b) =>
    b.date.localeCompare(a.date) || (RANK[b.priority] || 0) - (RANK[a.priority] || 0));
  const unread = all.filter(it => !seen.has(it.link)).length;
  // 公司名单来自数据(export_companies.py 的 COMPANIES)，加减公司不用改这里
  const names = DATA.companies.map(c => c.name);
  const coNames = names.length > 1 ? names.slice(0, -1).join('、') + ' 和 ' + names[names.length - 1] : names.join('');
  document.getElementById('status').innerHTML = all.length
    ? `${coNames} 这 7 天的重要发布，${all.length} 篇${unread ? `，<b>${unread}</b> 篇没看 · <button type="button" id="markAll">全部标为已读</button>` : '，都看过了'}。`
    : `${coNames} 这 7 天的重要发布。`;

  const fo = document.getElementById('filterOn');
  if (FILTER) {
    const label = FILTER.kind === 'company' ? (DATA.companies.find(c => c.key === FILTER.value) || {}).name : FILTER.value;
    fo.innerHTML = `只看 <b>${esc(label)}</b><button type="button" id="clearFilter">看全部</button>`;
    fo.hidden = false;
  } else { fo.hidden = true; }

  const items = all.filter(matches);
  if (!all.length) { document.getElementById('list').innerHTML = '<p class="empty">这 7 天两家都没发什么。</p>'; return; }
  if (!items.length) { document.getElementById('list').innerHTML = '<p class="empty">这个筛选下没有内容。</p>'; return; }

  const byDay = {};
  items.forEach(it => (byDay[it.date] = byDay[it.date] || []).push(it));
  const WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('list').innerHTML = Object.keys(byDay).sort().reverse().map(day => {
    const [y, m, dd] = day.split('-').map(Number);
    const dt = new Date(y, m - 1, dd), t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const diff = Math.round((t0 - dt) / 864e5);
    // 跟 Recent 页同一个左栏：今天/昨天也标出来
    const wk = (diff === 0 ? '今天 · ' : diff === 1 ? '昨天 · ' : '') + WK[dt.getDay()];
    return `<section class="day">
      <div class="d"><b>${dd}</b>${MONTHS[m - 1]}<span class="wk">${wk}</span></div>
      <div>${byDay[day].map(it => {
        const read = seen.has(it.link);
        const cls = ['item', it.priority || 'low', it.image ? '' : 'noimg', read ? 'read' : ''].join(' ');
        const coOn = FILTER && FILTER.kind === 'company' && FILTER.value === it.key ? ' on' : '';
        const tags = (it.tags || []).map(t => {
          const on = FILTER && FILTER.kind === 'tag' && FILTER.value === t ? ' on' : '';
          return `<span class="sep">·</span><button type="button" class="tg filterable${on}" data-tag="${esc(t)}" title="只看 ${esc(t)}">${esc(t)}</button>`;
        }).join('');
        const link = `href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}"`;
        return `<article class="${cls}">
          <div>
            <div class="m">${read ? '' : '<span class="unread" title="还没看过"></span>'}<button type="button" class="co filterable ${esc(it.key)}${coOn}" data-company="${esc(it.key)}" title="只看 ${esc(it.company)}">${esc(it.company)}</button>${tags}${noteBtn(it, noted.has(it.link))}</div>
            <h2><a ${link}>${esc(it.title)}</a></h2>
            ${it.summary ? `<p class="sum">${esc(it.summary)}</p>` : ''}
          </div>
          ${it.image ? `<a class="pic" ${link}><img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>` : ''}
        </article>`;
      }).join('')}</div>
    </section>`;
  }).join('');

  // 配图挂了：这一行变成没有图的
  document.querySelectorAll('.pic img').forEach(img => img.addEventListener('error', () => {
    const item = img.closest('.item');
    img.parentElement.remove();
    item.classList.add('noimg');
  }, { once: true }));
}

function toggleFilter(kind, value) {
  FILTER = FILTER && FILTER.kind === kind && FILTER.value === value ? null : { kind, value };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('click', e => {
  if (e.target.id === 'markAll') {
    const s = loadSeen(); DATA.items.forEach(it => s.add(it.link)); saveSeen(s); render(); return;
  }
  if (e.target.id === 'clearFilter') { FILTER = null; render(); return; }
  const nb = e.target.closest('.note-btn');
  if (nb) {
    if (nb.classList.contains('noted')) return;   // 已记：默认跳转走 open 就行
    setNoted(nb.dataset.noteLink, true);
    saveName(nb.dataset.noteLink, nb.dataset.name);
    // 必须等默认跳转带着 new 链接发出去之后再改 href，否则这次就跳到还不存在的笔记上
    setTimeout(() => {
      nb.classList.add('noted');
      nb.title = '打开已记的那条笔记（右键取消标记）';
      nb.href = openHref(nb.dataset.name);
    }, 0);
    return;
  }
  const co = e.target.closest('[data-company]');
  if (co) { toggleFilter('company', co.dataset.company); return; }
  const tg = e.target.closest('[data-tag]');
  if (tg) { toggleFilter('tag', tg.dataset.tag); return; }
  const a = e.target.closest('a[data-link]');
  if (a) { const s = loadSeen(); s.add(a.dataset.link); saveSeen(s); setTimeout(render, 300); }
});

(async function init() {
  try { DATA = await (await fetch('data/companies.json')).json(); }
  catch (e) { document.getElementById('list').innerHTML = '<p class="empty">数据没读到。</p>'; return; }
  render();
})();
</script>
</body>
