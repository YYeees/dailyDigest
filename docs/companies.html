<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>大公司 · Daily Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&display=swap">
<style>
  /* ============================================================
     大公司 —— Anthropic、OpenAI 近期的重要发布，"补课"用。
     用户平时很少点开公司消息，但常在别处看到才发现错过了；又觉得官网文章配图很想让人点。
     所以：只放判成high的；以文章配图为主角，杂志式排版；没点开过的带红点，顶上告诉你还剩几条。
     数据：data/companies.json(scripts/export_companies.py)。"看过"记在本浏览器。
     OpenAI官网不让脚本抓配图，给它画黑底标题卡。
     只在全量站。export_public.py不导出这个页面。
     ============================================================ */
  :root {
    --bg: #FFFFFF; --ink: #111111; --soft: #4A4A4A; --faint: #8A8A8A; --rule: #111111; --hair: #E7E3DC;
    --red: #9E2F22;
    --anthropic: #C96442; --openai: #111111;
    --serif: "Libre Baskerville", "Baskerville", "Songti SC", Georgia, serif;
    --sans: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .top { max-width: 1040px; margin: 0 auto; padding: 34px 24px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .mark { font-family: var(--serif); font-size: 20px; }
  .top nav { display: flex; gap: 30px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .top nav a:hover, .top nav a.on { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .intro { padding: 96px 0 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
  .intro h1 { font-family: var(--serif); font-weight: 400; font-size: 14px; letter-spacing: .24em; text-transform: uppercase; margin: 0; color: var(--soft); }
  .intro p { margin: 8px 0 0; color: var(--faint); font-size: 13.5px; }
  .status { font-size: 14px; color: var(--soft); text-align: right; }
  .status b { color: var(--red); font-weight: 600; }
  .status .dot, .unread-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); vertical-align: 2px; margin-right: 8px; }
  .status button { display: block; margin-top: 4px; margin-left: auto; font-size: 12.5px; color: var(--faint); }
  .status button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  .filters { display: flex; gap: 26px; padding: 14px 0 0; border-top: 1px solid var(--rule); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .filters button { color: var(--faint); padding-bottom: 4px; }
  .filters button.on, .filters button:hover { color: var(--ink); }
  .filters button.on { border-bottom: 1px solid var(--ink); }

  /* ---------------- 配图 ---------------- */
  .pic { position: relative; display: block; overflow: hidden; background: #F0EEE6; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s ease; }
  a:hover .pic img, a:hover .pic .titlecard { transform: scale(1.025); }
  /* 拿不到配图时的标题卡：OpenAI 黑底白字；其他(配图加载失败)象牙底深字 */
  .titlecard { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 7%; transition: transform .9s ease; }
  .titlecard .co { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  .titlecard .tt { font-weight: 500; line-height: 1.12; letter-spacing: -.01em; }
  .titlecard.openai { background: #000; color: #fff; }
  .titlecard.anthropic { background: #F0EEE6; color: #191919; }
  .titlecard.anthropic .tt { font-family: var(--serif); font-weight: 400; }
  .badge { position: absolute; z-index: 2; top: 14px; right: 14px; width: 11px; height: 11px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 3px #fff; }

  .meta { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-top: 16px; }
  .meta .co { font-weight: 600; }
  .meta .co.anthropic { color: var(--anthropic); }
  .meta .co.openai { color: var(--openai); }

  /* 头条 */
  .lead { display: grid; grid-template-columns: 1.55fr 1fr; gap: 40px; align-items: end; padding: 40px 0 48px; border-bottom: 1px solid var(--hair); }
  .lead .pic { aspect-ratio: 16 / 10; }
  .lead .pic .titlecard .tt { font-size: clamp(26px, 3.4vw, 42px); }
  .lead h2 { font-family: var(--serif); font-weight: 400; font-size: 32px; line-height: 1.25; margin: 10px 0 0; }
  .lead .sum { color: var(--soft); font-size: 15px; line-height: 1.85; margin: 16px 0 0; text-align: justify; }
  .lead .go { display: inline-block; margin-top: 18px; color: var(--soft); font-size: 15px; }
  .lead a:hover h2 { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }

  /* 其余两列 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px 40px; padding: 44px 0 40px; }
  .card .pic { aspect-ratio: 16 / 10; }
  .card .pic .titlecard .tt { font-size: clamp(20px, 2.2vw, 28px); }
  .card h3 { font-family: var(--serif); font-weight: 400; font-size: 21px; line-height: 1.35; margin: 8px 0 0; }
  .card a:hover h3 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .card .sum { color: var(--soft); font-size: 14px; line-height: 1.75; margin: 10px 0 0;
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .is-read h2, .is-read h3 { color: var(--soft); }

  .foot { text-align: center; color: var(--faint); font-size: 13px; padding: 20px 24px 90px; border-top: 1px solid var(--rule); }

  @media (max-width: 760px) {
    .top nav { gap: 14px; font-size: 11.5px; }
    .intro { padding-top: 56px; }
    .lead { grid-template-columns: 1fr; gap: 0; padding-top: 28px; }
    .lead h2 { font-size: 26px; }
    .grid { grid-template-columns: 1fr; gap: 40px; }
    .status { text-align: left; }
    .status button { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html">Daily Digest</a>
    <nav>
      <a href="index.html">Recent</a>
      <a href="albums.html">People</a>
      <a href="companies.html" class="on">Companies</a>
      <a href="letter.html">Letters</a>
    </nav>
  </header>
  <div class="wrap">
    <section class="intro">
      <div>
        <h1>Companies</h1>
        <p id="sub">Anthropic 和 OpenAI 近期的重要发布。</p>
      </div>
      <div class="status" id="status"></div>
    </section>
    <div class="filters" id="filters"></div>
    <main id="main"></main>
  </div>
  <p class="foot" id="foot"></p>

<script>
const SEEN_KEY = 'companies-seen-v1';   // [link, ...] 点开过的
const loadSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } };
const saveSeen = s => { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...s])); } catch (e) {} };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = iso => { const [y, m, d] = iso.split('-').map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; };

let DATA = null;
let filter = 'all';

function titlecard(it) {
  return `<div class="titlecard ${esc(it.key)}"><span class="co">${esc(it.company)}</span><span class="tt">${esc(it.title)}</span></div>`;
}
function pic(it, seen) {
  const inner = it.image
    ? `<img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-link="${esc(it.link)}">`
    : titlecard(it);
  return `<span class="pic">${seen.has(it.link) ? '' : '<span class="badge" title="还没看过"></span>'}${inner}</span>`;
}
function meta(it) {
  return `<div class="meta"><span class="co ${esc(it.key)}">${esc(it.company)}</span><span>${fmt(it.date)}</span></div>`;
}

function render() {
  const seen = loadSeen();
  const items = DATA.items.filter(it => filter === 'all' || it.key === filter);
  const unread = DATA.items.filter(it => !seen.has(it.link)).length;

  document.getElementById('sub').textContent = `Anthropic 和 OpenAI 近 ${DATA.window_days} 天的重要发布，一共 ${DATA.items.length} 条。`;
  document.getElementById('status').innerHTML = unread
    ? `<span class="dot"></span>还有 <b>${unread}</b> 条没看<button type="button" id="markAll">全部标为已读</button>`
    : '都看过了';
  document.getElementById('filters').innerHTML = [['all', '全部'], ...DATA.companies.map(c => [c.key, c.name])]
    .map(([k, label]) => `<button type="button" data-k="${k}" class="${k === filter ? 'on' : ''}">${esc(label)}</button>`).join('');

  if (!items.length) { document.getElementById('main').innerHTML = '<p class="foot">这里还没有内容。</p>'; return; }
  const [lead, ...rest] = items;
  const readCls = it => (seen.has(it.link) ? ' is-read' : '');
  document.getElementById('main').innerHTML = `
    <article class="lead${readCls(lead)}">
      <a href="${esc(lead.link)}" target="_blank" rel="noopener" data-link="${esc(lead.link)}">${pic(lead, seen)}</a>
      <div>
        ${meta(lead)}
        <a href="${esc(lead.link)}" target="_blank" rel="noopener" data-link="${esc(lead.link)}"><h2>${esc(lead.title)}</h2></a>
        ${lead.summary ? `<p class="sum">${esc(lead.summary)}</p>` : ''}
        <a class="go" href="${esc(lead.link)}" target="_blank" rel="noopener" data-link="${esc(lead.link)}">Read →</a>
      </div>
    </article>
    <section class="grid">${rest.map(it => `
      <article class="card${readCls(it)}">
        <a href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}">
          ${pic(it, seen)}
          ${meta(it)}
          <h3>${esc(it.title)}</h3>
          ${it.summary ? `<p class="sum">${esc(it.summary)}</p>` : ''}
        </a>
      </article>`).join('')}
    </section>`;
  // 配图挂了：换成标题卡
  document.querySelectorAll('.pic img').forEach(img => img.addEventListener('error', () => {
    const it = DATA.items.find(x => x.link === img.dataset.link);
    img.replaceWith(Object.assign(document.createElement('div'), { innerHTML: titlecard(it) }).firstChild);
  }, { once: true }));
}

document.addEventListener('click', e => {
  const f = e.target.closest('#filters button');
  if (f) { filter = f.dataset.k; render(); return; }
  if (e.target.id === 'markAll') {
    const s = loadSeen(); DATA.items.forEach(it => s.add(it.link)); saveSeen(s); render(); return;
  }
  const a = e.target.closest('a[data-link]');
  if (a) {
    const s = loadSeen(); s.add(a.dataset.link); saveSeen(s);
    setTimeout(render, 300);   // 等新标签页打开后再刷新红点
  }
});

(async function init() {
  try { DATA = await (await fetch('data/companies.json')).json(); }
  catch (e) { document.getElementById('main').innerHTML = '<p class="foot">数据没读到。</p>'; return; }
  render();
  document.getElementById('foot').textContent = `更新于 ${DATA.updated_at.slice(0, 10)}`;
})();
</script>
</body>
</html>
